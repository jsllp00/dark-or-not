<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark or Not? · Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:860px; margin:0 auto; padding:28px 20px 120px; display:flex; flex-direction:column; gap:20px}
  .top{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .top h1{font-size:1.6rem}
  .top a{margin-left:auto; color:var(--accent); font-weight:700}
  .sec{padding:20px; display:flex; flex-direction:column; gap:14px}
  .sec h2{font-size:1.15rem}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  label{font-weight:700; font-size:.9rem}
  .lab{display:flex; flex-direction:column; gap:6px}
  textarea.field{min-height:96px; resize:vertical; line-height:1.45}
  .imgrow{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
  .thumb{width:220px; aspect-ratio:16/10; max-width:100%; border-radius:10px; border:1px dashed var(--line); background:var(--bg); display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:.85rem}
  .thumb img{width:100%; height:100%; object-fit:contain; background:var(--surface)}
  .imgbtns{display:flex; flex-direction:column; gap:8px}
  .time{width:7rem}
  .opt{display:flex; gap:8px}
  .badge{font:700 .72rem/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:6px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent)}
  .savebar{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:14px 20px}
  .savebar .in{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:14px}
  #status{color:var(--muted)}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <div class="top"><h1>Poll editor</h1><a href="present.html">Open presenter →</a></div>
  <div class="card sec">
    <h2>Scale labels (polls 1–6)</h2>
    <div class="grid2">
      <div class="lab"><label for="lblL">1 means</label><input id="lblL" class="field"></div>
      <div class="lab"><label for="lblR">5 means</label><input id="lblR" class="field"></div>
    </div>
  </div>
  <div id="polls" style="display:flex; flex-direction:column; gap:20px"></div>
</div>
<div class="savebar" id="bar" hidden><div class="in">
  <button class="btn" id="save" type="button">Save all changes</button>
  <span id="status" aria-live="polite"></span>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
requirePin(start);

async function start(){
  const $ = id => document.getElementById(id);
  $("app").hidden = false; $("bar").hidden = false;
  const [pSnap, lSnap] = await Promise.all([db.ref("polls").get(), db.ref("config/labels").get()]);
  let polls = normalizePolls(pSnap.val());
  const labels = Object.assign({}, DEFAULT_LABELS, lSnap.val() || {});
  $("lblL").value = labels.left; $("lblR").value = labels.right;
  let dirty = false;
  const mark = () => { dirty = true; $("status").textContent = "Unsaved changes"; };

  function draw(){
    $("polls").innerHTML = polls.map((p,i) => `
      <div class="card sec" data-i="${i}">
        <div style="display:flex; align-items:center; gap:10px"><h2>Poll ${i+1}</h2><span class="badge">${p.type === "scale" ? "Slider 1–5" : "Multiple choice"}</span></div>
        <div class="lab"><label for="q${i}">Question</label><textarea id="q${i}" class="field" data-f="q">${esc(p.q)}</textarea></div>
        <div class="lab"><span style="font-weight:700; font-size:.9rem">Image</span>
          <div class="imgrow">
            <div class="thumb">${p.img ? `<img src="${esc(p.img)}" alt="Poll ${i+1} image">` : "No image yet"}</div>
            <div class="imgbtns">
              <label class="btn ghost small" for="f${i}" style="font-size:.9rem">${p.img ? "Replace image" : "Upload image"}</label>
              <input id="f${i}" type="file" accept="image/*" hidden data-file="${i}">
              ${p.img ? `<button class="btn ghost small danger" type="button" data-rm="${i}">Remove image</button>` : ""}
            </div>
          </div>
        </div>
        <div class="lab"><label for="t${i}">Timer (seconds)</label><input id="t${i}" class="field time mono" type="number" min="5" max="600" value="${p.time}" data-f="time"></div>
        ${p.type === "choice" ? `<div class="lab"><span style="font-weight:700; font-size:.9rem">Options</span>
          ${p.options.map((o,k) => `<div class="opt"><input class="field" aria-label="Option ${k+1}" value="${esc(o)}" data-opt="${k}">${p.options.length > 2 ? `<button class="btn ghost small" type="button" data-delopt="${k}" aria-label="Remove option ${k+1}">✕</button>` : ""}</div>`).join("")}
          ${p.options.length < 6 ? `<button class="btn ghost small" type="button" data-addopt style="align-self:flex-start">+ Add option</button>` : ""}
        </div>` : ""}
      </div>`).join("");
  }
  draw();

  $("polls").addEventListener("input", e => {
    const card = e.target.closest("[data-i]"); if (!card) return;
    const p = polls[+card.dataset.i];
    if (e.target.dataset.f === "q") p.q = e.target.value;
    if (e.target.dataset.f === "time") p.time = Math.max(5, Math.min(600, parseInt(e.target.value) || DEFAULT_TIME));
    if (e.target.dataset.opt !== undefined) p.options[+e.target.dataset.opt] = e.target.value;
    mark();
  });
  $("lblL").addEventListener("input", mark); $("lblR").addEventListener("input", mark);

  $("polls").addEventListener("click", e => {
    const card = e.target.closest("[data-i]"); if (!card) return;
    const p = polls[+card.dataset.i];
    if (e.target.dataset.rm !== undefined) { p.img = ""; mark(); draw(); }
    if (e.target.dataset.addopt !== undefined) { p.options.push("New option"); mark(); draw(); }
    if (e.target.dataset.delopt !== undefined) { p.options.splice(+e.target.dataset.delopt, 1); mark(); draw(); }
  });

  $("polls").addEventListener("change", async e => {
    if (e.target.dataset.file === undefined) return;
    const i = +e.target.dataset.file, file = e.target.files && e.target.files[0];
    if (!file) return;
    $("status").textContent = "Preparing image…";
    try { polls[i].img = await shrink(file); mark(); draw(); }
    catch (err) { $("status").textContent = "That file couldn't be read as an image. Try a PNG or JPG."; }
  });

  // Resize in the browser so images stay small enough to load quickly on phones.
  function shrink(file){
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  $("save").addEventListener("click", async () => {
    $("save").disabled = true; $("status").textContent = "Saving…";
    try {
      const clean = polls.map(p => ({ q: p.q.trim(), img: p.img, time: p.time, ...(p.type === "choice" ? { options: p.options.map(o => o.trim()).filter(Boolean) } : {}) }));
      await db.ref("polls").set(clean);
      await db.ref("config/labels").set({ left: $("lblL").value.trim() || DEFAULT_LABELS.left, right: $("lblR").value.trim() || DEFAULT_LABELS.right });
      dirty = false; $("status").textContent = "Saved. Phones and the presenter update right away.";
    } catch (err) {
      $("status").textContent = "Couldn't save. Check your internet connection and try again.";
    }
    $("save").disabled = false;
  });

  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
}
</script>
</body>
</html>
