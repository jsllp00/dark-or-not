<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark or Not? · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .app{height:100%; display:grid; grid-template-rows:auto 1fr; padding:0 32px}
  header{display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  header .brand{font-weight:700; font-size:1.1rem}
  header .join{margin-left:auto; color:var(--muted); font-size:.95rem}
  header .join b{color:var(--ink); font-family:var(--mono)}
  main{overflow:auto; padding:28px 0; min-height:0}
  .eyebrow{font:700 .8rem/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

  /* lobby */
  .lobby{display:grid; grid-template-columns:auto minmax(0,1fr); gap:40px; align-items:start}
  .qr{padding:22px; display:flex; flex-direction:column; gap:14px; align-items:center}
  #qr img,#qr canvas{display:block; width:300px; height:300px}
  .qr .url{font:500 .85rem var(--mono); color:var(--muted); word-break:break-all; max-width:300px; text-align:center}
  .count{font-size:4.5rem; font-weight:700; line-height:1}
  .names{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
  .chip{padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:700}
  .chip.yes{background:var(--accent-soft); border-color:var(--accent)}
  .chip.yes::before{content:"✓ "; color:var(--accent)}
  .bar-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:28px}
  select.field{width:auto; padding:12px 14px}

  /* poll */
  .poll{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:36px; align-items:start}
  .poll img{width:100%; max-height:52vh; object-fit:contain; border-radius:14px; border:1px solid var(--line); background:var(--surface)}
  .q{font-size:clamp(1.3rem,2vw,1.9rem); font-weight:700; margin:12px 0 0; line-height:1.3}
  .side{padding:24px; display:flex; flex-direction:column; gap:20px}
  .clock{font:700 5rem/1 var(--mono); font-variant-numeric:tabular-nums}
  .clock.over{color:var(--warn)}
  .prog{height:12px; border-radius:6px; background:var(--line); overflow:hidden}
  .prog b{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
  .resp{display:flex; justify-content:space-between; align-items:baseline; font-weight:700}
  .resp .mono{font-size:1.6rem}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .names.small .chip{font-size:.85rem; padding:6px 11px}

  /* results */
  .bars{display:flex; flex-direction:column; gap:12px}
  .b{display:grid; grid-template-columns:minmax(0,8rem) minmax(0,1fr) 3rem; gap:12px; align-items:center}
  .b .lab{font-weight:700; min-width:0}
  .b .tr{height:38px; background:var(--accent-soft); border-radius:8px; overflow:hidden}
  .b .fi{height:100%; background:var(--accent); border-radius:8px; width:0; transition:width .6s ease}
  .b .ct{font:700 1.3rem var(--mono); text-align:right}
  .scale-b .lab{font:700 1.3rem var(--mono); text-align:center}
  .summary{display:flex; gap:18px; align-items:center; padding:14px 16px; background:var(--bg); border-radius:12px; flex-wrap:wrap}
  .summary .avg{font:700 2.4rem/1 var(--mono)}
  .tag{font:700 .8rem/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:7px 11px; border-radius:999px; border:1.5px solid var(--ink)}
  .ends{display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; font-weight:700}
  .b{cursor:pointer}
  .b .who{grid-column:1 / -1; font-size:.95rem; color:var(--muted); padding:2px 0 6px calc(8rem + 12px)}
  .end-label{font-weight:700; color:var(--muted); padding-left:calc(8rem + 12px); margin:6px 0}
  .summary{margin-top:16px}
  .scale-b .b{grid-template-columns:2.5rem minmax(0,1fr) 3rem}
  .scale-b .b .who{padding-left:calc(2.5rem + 12px)}
  .end-label.scale-end{padding-left:calc(2.5rem + 12px)}
  @media (max-width:900px){ .lobby,.poll{grid-template-columns:minmax(0,1fr)} .app{padding:0 16px} }
  @media (prefers-reduced-motion:reduce){ .fi,.prog b{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header>
    <div class="brand">Dark or Not?</div>
    <button class="btn ghost small" id="toLobby" type="button">Lobby</button>
    <div class="join">Join at <b id="joinShort"></b></div>
  </header>
  <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
requirePin(start);

function start(){
  const $ = id => document.getElementById(id);
  $("app").hidden = false;
  const JOIN_URL = new URL("index.html", location.href).href;
  $("joinShort").textContent = JOIN_URL.replace(/^https?:\/\//, "").replace(/index\.html$/, "");

  let polls = normalizePolls(null), labels = DEFAULT_LABELS, live = { state: "lobby" }, people = {}, resp = {};
  let respRef = null, view = null, resetArmed = null;

  db.ref("polls").on("value", s => { polls = normalizePolls(s.val()); render(true); });
  db.ref("config/labels").on("value", s => { labels = Object.assign({}, DEFAULT_LABELS, s.val() || {}); render(true); });
  db.ref("participants").on("value", s => { people = s.val() || {}; render(false); });
  db.ref("live").on("value", s => {
    live = s.val() || { state: "lobby" };
    if (respRef) { respRef.off(); respRef = null; }
    resp = {};
    if (live.round) { respRef = db.ref("responses/" + live.round); respRef.on("value", r => { resp = r.val() || {}; render(false); }); }
    render(true);
  });

  $("toLobby").addEventListener("click", () => db.ref("live").set({ state: "lobby", next: live.next ?? nextIndex() }));

  function nextIndex(){
    if (typeof live.poll === "number") return Math.min(POLL_COUNT - 1, live.poll + (live.state === "lobby" ? 0 : 1));
    return 0;
  }
  function names(){ return Object.entries(people).map(([id,p]) => ({ id, name: p.name, at: p.joinedAt || 0 })).sort((a,b) => a.at - b.at); }

  function startPoll(i){
    const round = db.ref().push().key;
    const secs = polls[i].time || DEFAULT_TIME;
    const t = now();
    db.ref("live").set({ state: "voting", poll: i, round, startedAt: t, endsAt: t + secs * 1000 });
  }

  // full = rebuild layout; otherwise just refresh live numbers
  function render(full){
    const mode = live.state === "voting" ? "voting" : live.state === "results" ? "results" : "lobby";
    if (full || view !== mode + (live.round || "")) { view = mode + (live.round || ""); build(mode); }
    refresh(mode);
  }

  function build(mode){
    const m = $("main");
    if (mode === "lobby") {
      const nx = typeof live.next === "number" ? live.next : 0;
      m.innerHTML = `<div class="lobby">
        <div class="card qr"><div id="qr"></div><div class="url">${esc(JOIN_URL)}</div></div>
        <div>
          <div class="eyebrow">Scan to join</div>
          <div style="display:flex; align-items:baseline; gap:14px; margin-top:12px"><span class="count mono" id="cnt">0</span><span class="muted" style="font-size:1.3rem">joined</span></div>
          <div class="names" id="nameList"></div>
          <div class="bar-row">
            <label for="pick" class="muted">Start</label>
            <select id="pick" class="field">${polls.map((p,i) => `<option value="${i}" ${i===nx?"selected":""}>Poll ${i+1}${p.type==="choice"?" (multiple choice)":""}</option>`).join("")}</select>
            <button class="btn" id="startBtn" type="button">Start poll</button>
            <button class="btn ghost small danger" id="resetBtn" type="button" style="margin-left:auto">Reset session</button>
          </div>
        </div></div>`;
      new QRCode($("qr"), { text: JOIN_URL, width: 300, height: 300, colorDark: "#141824", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      $("startBtn").addEventListener("click", () => startPoll(+$("pick").value));
      $("resetBtn").addEventListener("click", () => {
        const b = $("resetBtn");
        if (!resetArmed) { b.textContent = "Click again to remove everyone"; resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "Reset session"; }, 3000); return; }
        clearTimeout(resetArmed); resetArmed = null;
        db.ref("participants").remove(); db.ref("live").set({ state: "lobby", next: 0 });
      });
      return;
    }
    const p = polls[live.poll];
    const left = `<section>
        <div class="eyebrow">Poll ${live.poll + 1} of ${POLL_COUNT}</div>
        ${p.img ? `<img src="${esc(p.img)}" alt="" style="margin-top:12px">` : ""}
        <p class="q">${esc(p.q)}</p>
      </section>`;
    if (mode === "voting") {
      m.innerHTML = `<div class="poll">${left}
        <aside class="card side">
          <div class="clock" id="clock">0:45</div>
          <div class="row"><button class="btn ghost small" id="plus" type="button">+15s</button><button class="btn" id="finish" type="button">Finish</button></div>
          <div><div class="resp"><span>Responded</span><span class="mono" id="rc">0 / 0</span></div><div class="prog" style="margin-top:8px"><b id="rb"></b></div></div>
        </aside></div>`;
      $("plus").addEventListener("click", () => {
        const base = Math.max(now(), live.endsAt);
        db.ref("live").update({ endsAt: base + 15000 });
      });
      $("finish").addEventListener("click", () => db.ref("live").update({ state: "results" }));
    } else {
      m.innerHTML = `<div class="poll">${left}
        <aside class="card side">
          <div class="eyebrow">Results</div>
          <div id="results"></div>
          <div class="row">
            ${live.poll < POLL_COUNT - 1 ? `<button class="btn" id="next" type="button">Start poll ${live.poll + 2}</button>` : ""}
            <button class="btn ghost" id="lob" type="button">Back to lobby</button>
          </div>
        </aside></div>`;
      const n = $("next"); if (n) n.addEventListener("click", () => startPoll(live.poll + 1));
      $("lob").addEventListener("click", () => db.ref("live").set({ state: "lobby", next: Math.min(POLL_COUNT - 1, live.poll + 1) }));
      drawResults(p);
    }
  }

  function refresh(mode){
    const list = names();
    if (mode === "lobby") {
      $("cnt").textContent = list.length;
      $("nameList").innerHTML = list.length ? list.map(x => `<span class="chip">${esc(x.name)}</span>`).join("") : `<span class="muted">Names appear here as people join.</span>`;
      return;
    }
    if (mode === "voting") {
      const done = list.filter(x => resp[x.id]).length;
      $("rc").textContent = done + " / " + list.length;
      $("rb").style.width = (list.length ? done / list.length * 100 : 0) + "%";
    }
    if (mode === "results") drawResults(polls[live.poll]);
  }

  function drawResults(p){
    const el = $("results"); if (!el) return;
    const vals = Object.values(resp).map(r => r.v);
    if (p.type === "scale") {
      const who = [[],[],[],[],[]];
      Object.entries(resp).forEach(([id, r]) => { if (r.v >= 1 && r.v <= 5) who[r.v-1].push((people[id] && people[id].name) || "Unknown"); });
      const c = who.map(w => w.length);      const n = c.reduce((a,b) => a+b, 0), max = Math.max(1, ...c);
      let summary = `<span class="muted">No answers.</span>`;
      if (n) {
        const avg = c.reduce((a,b,i) => a + b*(i+1), 0) / n;
        const low = (c[0]+c[1]) / n, high = (c[3]+c[4]) / n;
        const tag = (low >= .3 && high >= .3) ? "Split verdict" : avg <= 2.2 ? "Leans good nudge" : avg >= 3.8 ? "Leans dark pattern" : "Grey area";
        summary = `<span class="avg">${avg.toFixed(1)}</span><span class="muted">average of ${n}</span><span class="tag">${tag}</span>`;
      }
        el.innerHTML = `<div class="end-label scale-end">${esc(labels.left)}</div>
        <div class="bars scale-b">${c.map((k,i) => `<div class="b"><span class="lab">${i+1}</span><div class="tr"><div class="fi" style="width:${k/max*100}%"></div></div><span class="ct">${k}</span><div class="who" hidden>${esc(who[i].join(", ") || "No one")}</div></div>`).join("")}</div>
        <div class="end-label scale-end">${esc(labels.right)}</div>
        <div class="summary">${summary}</div>`;
    } else {
      const opts = p.options || [];
      const who = opts.map(() => []);
      Object.entries(resp).forEach(([id, r]) => { if (who[r.v]) who[r.v].push((people[id] && people[id].name) || "Unknown"); });
      const c = who.map(w => w.length);      const n = c.reduce((a,b) => a+b, 0), max = Math.max(1, ...c);
      el.innerHTML = `<div class="bars">${opts.map((o,i) => `<div class="b"><span class="lab">${esc(o)}</span><div class="tr"><div class="fi" style="width:${c[i]/max*100}%"></div></div><span class="ct">${c[i]}</span><div class="who" hidden>${esc(who[i].join(", ") || "No one")}</div></div>`).join("")}</div>
      <p class="muted" style="margin:14px 0 0">${n} ${n === 1 ? "answer" : "answers"}</p>`;
    }
    el.onclick = e => { const b = e.target.closest(".b"); if (b) { const w = b.querySelector(".who"); w.hidden = !w.hidden; } };

  }

  setInterval(() => {
    if (live.state !== "voting") return;
    const el = $("clock"); if (!el) return;
    const left = Math.max(0, live.endsAt - now());
    const sec = Math.ceil(left / 1000);
    el.textContent = left > 0 ? Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0") : "Time's up";
    el.classList.toggle("over", left <= 0);
  }, 250);
}
</script>
</body>
</html>
